<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Dr Smartphone48">
  <!--
    Die Marke als Glaskörper.

    Zwei Anforderungen, die sich widersprechen: Bei 512 px soll man das Glas
    sehen – Randlicht, Glanzschliff, Tiefe. Bei 16 px in einem Browser-Tab ist
    von alledem nichts mehr übrig, dort zählt nur, ob Telefon und Kreuz als
    Form lesbar bleiben.

    Aufgelöst über die Reihenfolge: Der Glaskörper besteht aus großflächigen,
    weichen Verläufen, die beim Herunterskalieren zu einem einzigen dunklen
    Ton verschmelzen und nichts verschmutzen. Die Marke darüber ist reines
    Weiß mit kräftigen Strichstärken – sie überlebt jede Verkleinerung.
    Kein Schriftzug im Icon: „Dr Smartphone48" ist bei 16 px ein grauer
    Balken, mehr nicht.
  -->
  <defs>
    <!-- Korpus: kein flaches Schwarz. Von oben eingefallenes Licht, das nach
         unten in echtes Schwarz ausläuft – das gibt dem Körper Gewicht. -->
    <linearGradient id="dsBody" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#26282c" />
      <stop offset="0.34" stop-color="#0d0e10" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>

    <!-- Randlicht: hell an der oberen linken Kante, fast erloschen in der
         Mitte, und unten rechts ein zweites, schwächeres Aufleuchten – so
         verhält sich eine polierte Kante unter einer einzelnen Lichtquelle. -->
    <linearGradient id="dsRim" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="0.82" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55" />
    </linearGradient>

    <!-- Glanzschliff: die gebogene Spiegelung oben rechts. Ein gedrehter
         Ellipsenausschnitt, kein bloßer Verlauf – nur so bekommt er eine
         Kante, an der sich das Licht bricht. -->
    <linearGradient id="dsSheen" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Bodenreflex: das schwache Licht, das von unten zurückgeworfen wird. -->
    <radialGradient id="dsFloor" cx="0.5" cy="1.04" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Superellipse (|x|^5 + |y|^5 = 1) statt abgerundetem Rechteck. Der
         Unterschied ist bei 16 px unsichtbar und bei 512 px der zwischen
         „App-Icon" und „Rechteck mit runden Ecken". -->
    <path id="dsShape" d="M128.0 64.0 127.9 89.3 127.5 97.3 126.9 103.0 126.0 107.6 124.9 111.4 123.4 114.6 121.7 117.3 119.7 119.7 117.3 121.7 114.6 123.4 111.4 124.9 107.6 126.0 103.0 126.9 97.3 127.5 89.3 127.9 64.0 128.0 38.7 127.9 30.7 127.5 25.0 126.9 20.4 126.0 16.6 124.9 13.4 123.4 10.7 121.7 8.3 119.7 6.3 117.3 4.6 114.6 3.1 111.4 2.0 107.6 1.1 103.0 0.5 97.3 0.1 89.3 0.0 64.0 0.1 38.7 0.5 30.7 1.1 25.0 2.0 20.4 3.1 16.6 4.6 13.4 6.3 10.7 8.3 8.3 10.7 6.3 13.4 4.6 16.6 3.1 20.4 2.0 25.0 1.1 30.7 0.5 38.7 0.1 64.0 0.0 89.3 0.1 97.3 0.5 103.0 1.1 107.6 2.0 111.4 3.1 114.6 4.6 117.3 6.3 119.7 8.3 121.7 10.7 123.4 13.4 124.9 16.6 126.0 20.4 126.9 25.0 127.5 30.7 127.9 38.7Z" />
    <clipPath id="dsClip"><use href="#dsShape" /></clipPath>
  </defs>

  <!-- Körper -->
  <use href="#dsShape" fill="url(#dsBody)" />

  <g clip-path="url(#dsClip)">
    <rect width="128" height="128" fill="url(#dsFloor)" />
    <!-- Die Spiegelung sitzt über der oberen Hälfte und endet in einer
         gebogenen Kante, die nach rechts unten abfällt – wie bei einer
         konvexen Glasfläche unter einer Lichtquelle links oben. -->
    <ellipse cx="46" cy="-14" rx="92" ry="60" transform="rotate(-13 46 -14)" fill="url(#dsSheen)" />
  </g>

  <!-- Polierte Kante. Innen liegend, damit sie beim Skalieren nicht abreißt. -->
  <use href="#dsShape" fill="none" stroke="url(#dsRim)" stroke-width="2.4" />

  <!-- Die Marke: Gerätesilhouette und Diagnose-Kreuz.
       Strichstärken bewusst kräftig – das hier muss bei 16 px stehen. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <rect x="40.5" y="25.5" width="47" height="77" rx="14" stroke-width="7" />
    <path d="M64 41.5v45M50.5 64h27" stroke-width="6.4" />
  </g>
</svg>
